<!DOCTYPE html>
<html>
<head>
    <title>GACHA</title>
    <!-- Мета-теги для мобильных -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <link rel="stylesheet" href="style.css">
</head>

<body>
    
    <!-- ФОНОВОЕ ВИДЕО -->
    <!-- Добавь poster="poster.jpg" если есть картинка-заглушка -->
    <video autoplay loop muted playsinline class="background-video">
        <source src="back.mp4" type="video/mp4">
    </video>

    <!-- ————— ЭКРАН ОЖИДАНИЯ ————— -->
  <!-- ————— ЭКРАН ОЖИДАНИЯ ————— -->
<div id="startScreen" class="screen">
    <!-- ДОБАВИЛ id="mainTitle" -->
    <div id="mainTitle" class="title">GACHA</div> 
    
    <button id="startButton" class="play-button">PLAY</button>
</div>
    <!-- ————— ВИДЕО ГАЧИ (3 ШТУКИ) ————— -->
    <!-- preload="auto" заставляет планшет скачать их сразу при входе на сайт -->
    <!-- Они скрыты (hidden), но готовы к запуску -->
    <video id="vid-blue" class="gacha-video hidden" src="star_blue.MP4" muted playsinline preload="auto"></video>
    <video id="vid-purple" class="gacha-video hidden" src="star_purple.MP4" muted playsinline preload="auto"></video>
    <video id="vid-orange" class="gacha-video hidden" src="star_orange.MP4" muted playsinline preload="auto"></video>

    <!-- ————— ЗВУКИ РЕЗУЛЬТАТА (3 ШТУКИ) ————— -->
    <!-- preload="auto" — планшет скачает их сразу, чтобы звук не опаздывал -->
    <audio id="snd-blue" src="blue_end.MP3" preload="auto"></audio>
    <audio id="snd-purple" src="purple_end.MP3" preload="auto"></audio>
    <audio id="snd-orange" src="orange_end.MP3" preload="auto"></audio>

    <!-- ————— БЕЛАЯ ВСПЫШКА (МАСКИРОВКА ЛАГА) ————— -->
    <div id="flashOverlay" class="flash-overlay hidden"></div>

    <!-- ————— РЕЗУЛЬТАТ ————— -->
    <div id="result" class="result hidden">
        <div class="result-card">
            <h2 class="win-title">🎉 ВЫ ВЫИГРАЛИ!</h2>
            <p class="item-name"></p>
            <!-- Звёздочки редкости: 3 / 4 / 5, появляются по одной -->
            <div id="starsBox" class="stars"></div>
            <div class="buttons">
                <button id="closeButton" class="close-button">Закрыть</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
